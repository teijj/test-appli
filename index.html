<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ma Liste Photo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- En-tête -->
  <header class="app-header">
    <h1>Ma Liste Photo</h1>
    <button id="settingsBtn" class="btn-icon" aria-label="Paramètres">⚙️</button>
  </header>

  <!-- Zone de travail principale -->
  <main class="app-body">
    <!-- Zone d'affichage et de dessin -->
    <div class="photo-container" id="photoContainer">
      <canvas id="listCanvas"></canvas>
      <p class="placeholder-text" id="placeholderText">
        Prends une photo de ta liste pour commencer
      </p>
    </div>
  </main>

  <!-- Barre d'actions en bas -->
  <footer class="app-footer">
    <!-- Bouton pour déclencher la caméra du téléphone -->
    <label for="cameraInput" class="btn btn-primary">
      📷 photo
    </label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    <!-- Bouton Annuler (Retour en arrière) - masqué au début -->
    <button id="undoBtn" class="btn btn-warning" style="display: none;">
      ↩️ Annuler
    </button>
    <!-- Bouton pour effacer tout (masqué au début) -->
    <button id="clearBtn" class="btn btn-secondary" style="display: none;">
      🗑️ Réinitialiser
    </button>
  </footer>

    <!-- Barre de sélection des modes (masquée tant qu'aucune photo n'est chargée) -->
    <div class="mode-selector" id="modeSelector" style="display: none;">
        <button id="drawModeBtn" class="btn-mode active">✏️ Dessiner</button>
        <button id="panZoomModeBtn" class="btn-mode">🔍 Zoomer</button>
    </div>

    <!-- Panneau des paramètres (masqué par défaut) -->
    <div id="settingsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Paramètres</h2>
                <button id="closeSettingsBtn" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Option 1 : Taille du trait (qu'on déplace ici pour faire propre) -->
                <div class="setting-item">
                    <label for="brushSize">Épaisseur du trait :</label>
                    <div class="setting-control">
                        <input type="range" id="brushSize" min="2" max="20" value="6">
                        <span id="sizeValue">6 %</span>
                    </div>
                </div>
                <!-- Option 2 : Couleur du trait -->
                <div class="setting-item">
                    <label>Couleur du trait :</label>
                    <div class="color-palette" id="colorPalette">
                        <button class="color-dot active" data-color="#e74c3c" style="background-color: #e74c3c;" aria-label="Rouge"></button>
                        <button class="color-dot" data-color="#000000" style="background-color: #000000;" aria-label="Noir"></button>
                        <button class="color-dot" data-color="#ffffff" style="background-color: #ffffff; border: 1px solid #ccc;" aria-label="Blanc"></button>
                        <button class="color-dot" data-color="#2ecc71" style="background-color: #2ecc71;" aria-label="Vert"></button>
                        <button class="color-dot" data-color="#f1c40f" style="background-color: #f1c40f;" aria-label="Jaune"></button>
                    </div>
                </div>
                <!-- D'autres options pourront être ajoutées ici facilement plus tard -->
            </div>
        </div>
    </div>

  <script src="script.js"></script>
</body>
</html>
